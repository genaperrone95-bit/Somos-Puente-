<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somos Puente — Tu Proceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --cream:#f7dfb9;
    --bg:#faf6ec;
    --paper:#fffdf8;
    --forest:#68640d;
    --forest-deep:#3f3d08;
    --orange:#d8491d;
    --blue:#7fb5d3;
    --blue-deep:#4f8aab;
    --wine:#471010;
    --ink:#332f14;
    --ink-soft:#6b6644;
    --line:#e4d6ae;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .script{font-family:'Sacramento',cursive;}

  /* texture: faint dotted paper grain */
  .app{
    max-width:720px;
    margin:0 auto;
    padding:28px 20px 80px;
    position:relative;
  }

  /* ---------- HEADER ---------- */
  .brandbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
    gap:10px;
    flex-wrap:wrap;
  }
  .studio-toggle{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .studio-btn{
    font-size:11px;
    font-weight:700;
    padding:6px 11px;
    border-radius:99px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .studio-btn.active{
    background:var(--forest);
    border-color:var(--forest);
    color:#fff;
  }
  .pin-box{
    display:none;
    align-items:center;
    gap:6px;
    margin-top:8px;
  }
  .pin-box.open{display:flex;}
  .pin-box input{
    width:110px;
    padding:6px 9px;
    border-radius:8px;
    border:1.5px solid var(--line);
    font-size:12.5px;
    font-family:inherit;
  }
  .pin-box button{
    padding:6px 11px;
    border-radius:8px;
    border:none;
    background:var(--forest);
    color:#fff;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }
  .pin-error{font-size:11px; color:var(--orange); margin-top:4px; display:none;}
  .pin-error.show{display:block;}
  .wordmark-img{
    height:26px;
    width:auto;
    display:block;
  }
  .tagline{
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1.2px;
    font-weight:600;
  }

  .hero{
    background:var(--forest);
    background-image:radial-gradient(circle at 85% 20%, rgba(255,255,255,0.06), transparent 55%);
    border-radius:22px;
    padding:26px 24px 22px;
    margin-top:18px;
    color:var(--cream);
    position:relative;
    overflow:hidden;
  }
  .hero svg.deco{position:absolute; opacity:0.14; pointer-events:none;}
  .hero-greeting{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#d8d19b;
    font-weight:600;
    margin-bottom:4px;
  }
  .hero-name{
    font-size:28px;
    font-weight:800;
    color:#fff;
    margin-bottom:14px;
    line-height:1.15;
  }
  .setup-row{
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  .setup-row input{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:none;
    font-family:inherit;
    font-size:14px;
    background:rgba(255,255,255,0.14);
    color:#fff;
  }
  .setup-row input::placeholder{color:#d8d19b;}
  .setup-row button{
    padding:10px 16px;
    border-radius:10px;
    border:none;
    background:var(--orange);
    color:#fff;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .setup-row button:hover{background:#c23f18;}

  .login-error{
    display:none;
    margin-top:8px;
    font-size:12px;
    color:#ffd7c4;
    font-weight:600;
  }
  .login-error.show{display:block;}

  .progress-wrap{margin-top:18px;}
  .progress-labels{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#d8d19b;
    margin-bottom:6px;
    font-weight:600;
  }
  .progress-labels b{color:#fff; font-size:13px;}
  .progress-track{
    height:8px;
    background:rgba(255,255,255,0.18);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--orange), #f0975e);
    border-radius:99px;
    transition:width .6s ease;
    width:0%;
  }
  .current-stage-chip{
    margin-top:14px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.12);
    padding:6px 12px;
    border-radius:99px;
    font-size:12.5px;
    color:#fff;
    font-weight:600;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);}

  /* ---------- TIMELINE ---------- */
  .timeline{
    margin-top:34px;
    position:relative;
    padding-left:6px;
  }
  .stage{
    position:relative;
    padding-left:52px;
    padding-bottom:36px;
  }
  .stage:last-child{padding-bottom:0;}
  .stage-line{
    position:absolute;
    left:19px;
    top:44px;
    bottom:-4px;
    width:2px;
    stroke:none;
  }
  .stage-line svg{width:40px; height:100%; overflow:visible; position:absolute; left:-19px; top:0;}

  .node{
    position:absolute;
    left:0; top:0;
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800;
    font-size:15px;
    background:var(--paper);
    border:2.5px solid var(--line);
    color:var(--ink-soft);
    z-index:2;
    transition:all .3s ease;
  }
  .stage.done .node{background:var(--stage-color); border-color:var(--stage-color); color:#fff;}
  .stage.active .node{background:var(--paper); border-color:var(--stage-color); color:var(--stage-color); box-shadow:0 0 0 5px color-mix(in srgb, var(--stage-color) 18%, transparent);}

  .card{
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:18px;
    padding:18px 18px 16px;
    cursor:pointer;
    transition:border-color .25s ease, box-shadow .25s ease;
  }
  .stage.active .card{border-color:var(--stage-color); box-shadow:0 6px 20px -8px color-mix(in srgb, var(--stage-color) 40%, transparent);}
  .stage.done .card{opacity:0.92;}

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card-eyebrow{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:700;
    color:var(--stage-color);
    margin-bottom:2px;
  }
  .card-title{
    font-family:'Sacramento',cursive;
    font-size:30px;
    color:var(--ink);
    line-height:1;
    margin-bottom:6px;
  }
  .status-pill{
    font-size:10.5px;
    font-weight:700;
    padding:4px 10px;
    border-radius:99px;
    white-space:nowrap;
    background:var(--line);
    color:var(--ink-soft);
  }
  .stage.done .status-pill{background:var(--stage-color); color:#fff;}
  .stage.active .status-pill{background:color-mix(in srgb, var(--stage-color) 16%, white); color:var(--stage-color);}

  .card-desc{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.55;
    margin:6px 0 12px;
  }

  .caret{
    font-size:12px;
    color:var(--ink-soft);
    transition:transform .25s ease;
    margin-top:4px;
  }
  .stage.open .caret{transform:rotate(180deg);}

  .checklist{
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease;
  }
  .stage.open .checklist{max-height:400px;}
  .checklist-inner{padding-top:4px; border-top:1px dashed var(--line);}
  .item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 2px;
    font-size:13.5px;
    color:var(--ink);
  }
  .item + .item{border-top:1px solid #f1e9d3;}
  .check{
    width:19px; height:19px;
    border-radius:6px;
    border:2px solid var(--line);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all .15s ease;
  }
  .check.checked{background:var(--stage-color); border-color:var(--stage-color);}
  .check svg{width:11px; height:11px; opacity:0; transition:opacity .15s ease;}
  .check.checked svg{opacity:1;}
  .item-label{flex:1; cursor:pointer;}
  .item.checked .item-label{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line);}

  .stage-mini-bar{
    height:4px;
    background:var(--line);
    border-radius:99px;
    margin-top:12px;
    overflow:hidden;
  }
  .stage-mini-fill{
    height:100%;
    background:var(--stage-color);
    border-radius:99px;
    transition:width .5s ease;
  }
  .check.readonly, .item.readonly .item-label{cursor:default;}

  /* ---------- NOTES ---------- */
  .notes-block{
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .notes-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    font-weight:700;
    color:var(--stage-color);
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:8px;
  }
  .notes-view{
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink);
    background:color-mix(in srgb, var(--stage-color) 6%, white);
    border-radius:12px;
    padding:12px 14px;
    white-space:pre-wrap;
  }
  .notes-view.empty{color:var(--ink-soft); font-style:italic;}
  .notes-edit{
    width:100%;
    min-height:80px;
    border-radius:12px;
    border:1.5px solid var(--line);
    padding:12px 14px;
    font-family:inherit;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink);
    resize:vertical;
  }
  .notes-edit:focus{outline:none; border-color:var(--stage-color);}
  .notes-save-state{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:5px;
    height:14px;
  }

  /* ---------- RESOURCES / ATTACHMENTS ---------- */
  .res-block{
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .res-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    font-weight:700;
    color:var(--stage-color);
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:8px;
  }
  .res-empty{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .res-list{display:flex; flex-direction:column; gap:8px;}
  .res-card{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:12px;
    background:color-mix(in srgb, var(--stage-color) 6%, white);
    text-decoration:none;
    color:var(--ink);
    font-size:13.5px;
    font-weight:600;
    transition:background .15s ease;
  }
  .res-card:hover{background:color-mix(in srgb, var(--stage-color) 12%, white);}
  .res-icon{
    width:30px; height:30px;
    border-radius:9px;
    background:var(--stage-color);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    flex-shrink:0;
  }
  .res-meta{flex:1; min-width:0;}
  .res-meta .res-name{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .res-meta .res-url{display:block; font-weight:400; font-size:11px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .res-remove{
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); font-size:16px; line-height:1;
    padding:4px;
    flex-shrink:0;
  }
  .res-remove:hover{color:var(--orange);}
  .res-add{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:10px;
  }
  .res-add input{
    padding:9px 11px;
    border-radius:9px;
    border:1.5px solid var(--line);
    font-family:inherit;
    font-size:13px;
  }
  .res-add input:focus{outline:none; border-color:var(--stage-color);}
  .res-add button{
    align-self:flex-start;
    padding:8px 14px;
    border-radius:9px;
    border:none;
    background:var(--stage-color);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
  }
  .res-add-hint{font-size:11px; color:var(--ink-soft);}

  /* ---------- STUDIO PANEL (client list) ---------- */
  .panel-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(51,47,20,0.55);
    z-index:50;
    align-items:flex-start;
    justify-content:center;
    padding:6vh 16px;
    overflow-y:auto;
  }
  .panel-overlay.open{display:flex;}
  .panel-box{
    background:var(--paper);
    border-radius:20px;
    max-width:560px;
    width:100%;
    padding:22px;
    box-shadow:0 20px 60px -10px rgba(0,0,0,0.35);
  }
  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .panel-title{
    font-size:19px;
    font-weight:800;
    color:var(--forest);
  }
  .panel-close{
    background:none;
    border:none;
    font-size:18px;
    color:var(--ink-soft);
    cursor:pointer;
    padding:4px 8px;
  }
  .panel-loading, .panel-empty{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    padding:24px 0;
  }
  .panel-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 10px;
    border-radius:12px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .panel-row:hover{background:var(--cream);}
  .panel-row + .panel-row{border-top:1px solid var(--line);}
  .panel-avatar{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--forest);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:800;
    font-size:14px;
    flex-shrink:0;
  }
  .panel-info{flex:1; min-width:0;}
  .panel-name{font-weight:700; font-size:14px; color:var(--ink);}
  .panel-stage{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .panel-pct{
    font-size:13px;
    font-weight:800;
    color:var(--forest);
    white-space:nowrap;
  }
  .panel-actions{
    display:flex;
    gap:4px;
    flex-shrink:0;
  }
  .panel-action-btn{
    width:28px; height:28px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:13px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
  }
  .panel-action-btn:hover{background:var(--cream); border-color:var(--forest); color:var(--forest);}
  .panel-action-btn.danger:hover{border-color:var(--orange); color:var(--orange);}
  .panel-add{
    display:flex;
    gap:8px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .panel-add input{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-family:inherit;
    font-size:13px;
  }
  .panel-add input:focus{outline:none; border-color:var(--forest);}
  .panel-add button{
    padding:10px 16px;
    border-radius:10px;
    border:none;
    background:var(--forest);
    color:#fff;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }

  /* footer */
  .footer{
    margin-top:40px;
    text-align:center;
    padding-top:22px;
    border-top:1px solid var(--line);
  }
  .footer img{height:46px; width:auto;}
  .footer p{font-size:11.5px; color:var(--ink-soft); margin:10px 0 0;}

  .loading-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:8px;
  }

  @media (max-width:420px){
    .hero-name{font-size:23px;}
    .card-title{font-size:26px;}
  }
</style>
</head>

<script>
(function(){
  const STAGES = [
    {

      items: [

        'Entrega · Plan de acción'
      ]
    }
  ];

  const STUDIO_PIN = 'puente2026'; // cambiá esta clave por la que quieras usar con tu equipo

  // ---------- CONEXIÓN A SUPABASE ----------
  // Pegá acá tu Project URL y tu clave "anon public" (Project Settings → API en Supabase).
  const SUPABASE_URL = 'https://zpxjurkyiiiqcuwnbhcd.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpweGp1cmt5aWlpcWN1d25iaGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5OTA3OTUsImV4cCI6MjEwMjU2Njc5NX0.mGxwmux1MuV4pCOk8Atr5EOpLP0r2oiGyKWwSp_UBu8';
  const DB_CONNECTED = SUPABASE_URL.startsWith('http') && !SUPABASE_ANON_KEY.startsWith('PEGÁ');
  const sb = DB_CONNECTED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  let clientSlug = null;
  let state = {}; // { identidad: {checks:{0:true,...}, note:'...'}, ... }
  let openStage = null;
  let editorMode = false;
  let saveTimer = null;

  const $ = (id) => document.getElementById(id);

  function slugify(s){
    return s.toLowerCase().trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  }

  function updateHash(slug){
    try{ history.replaceState(null, '', '#c=' + slug); }catch(e){ /* ignore */ }
  }

  function showClientView(){
    $('setupRow').style.display = 'none';
    $('progressWrap').style.display = 'block';
    $('timeline').style.display = 'block';
    $('backToPanelWrap').style.display = editorMode ? 'block' : 'none';
  }

  async function loadClient(name){
    const slug = slugify(name);
    await loadClientBySlug(slug, name);
  }

  async function loadClientBySlug(slug, fallbackName){
    if(!DB_CONNECTED){
      $('loadingNote').textContent = 'El portal todavía no está conectado a la base de datos. Avisá a tu estudio.';
      return;
    }
    clientSlug = slug;
    $('loadingNote').textContent = 'Cargando tu proceso...';
    showClientView();

    try{
      const { data, error } = await sb.from('progress').select('data').eq('slug', clientSlug).maybeSingle();
      if(error) throw error;
      state = (data && data.data) ? data.data : {};
    }catch(e){
      state = {};
    }
    // ensure structure
    if(!state._meta) state._meta = {name: fallbackName || slug, createdAt: Date.now()};
    if(fallbackName) state._meta.name = fallbackName;
    STAGES.forEach(s => {
      if(!state[s.id]) state[s.id] = {checks:{}, note:'', resources:[]};
      if(!state[s.id].checks) state[s.id].checks = {};
      if(typeof state[s.id].note !== 'string') state[s.id].note = '';
      if(!Array.isArray(state[s.id].resources)) state[s.id].resources = [];
    });
    $('greetingName').textContent = 'Hola, ' + state._meta.name + ' 👋';
    $('loadingNote').textContent = '';
    updateHash(clientSlug);
    // persist immediately so a brand-new client isn't lost if nothing gets checked yet
    saveState();
    render();
  }

  async function saveState(){
    if(!DB_CONNECTED) return;
    state._meta.updatedAt = Date.now();
    try{
      const { error } = await sb.from('progress').upsert({
        slug: clientSlug,
        data: state,
        updated_at: new Date().toISOString()
      });
      if(error) throw error;
    }catch(e){
      $('loadingNote').textContent = 'No se pudo guardar. Probá de nuevo.';
    }
  }

  function stageCompletion(stage){
    const total = stage.items.length;
    let done = 0;
    for(let i=0;i<total;i++){ if(state[stage.id].checks[i]) done++; }
    return {done, total, pct: total ? Math.round(done/total*100) : 0};
  }

  function overallCompletion(){
    let done=0, total=0;
    STAGES.forEach(s=>{ const c = stageCompletion(s); done+=c.done; total+=c.total; });
    return {done, total, pct: total ? Math.round(done/total*100) : 0};
  }

  function currentStageIndex(){
    for(let i=0;i<STAGES.length;i++){
      const c = stageCompletion(STAGES[i]);
      if(c.pct < 100) return i;
    }
    return STAGES.length - 1;
  }

  function bridgeSVG(color, isLast){
    if(isLast) return '';
    return `<svg viewBox="0 0 40 100" preserveAspectRatio="none">
      <path d="M20 0 C 10 25, 30 55, 20 100" stroke="${color}" stroke-width="2" fill="none" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.55"/>
    </svg>`;
  }

  function checkIcon(){
    return `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  function resIcon(url){
    const u = (url||'').toLowerCase();
    if(u.includes('.pdf')) return '📄';
    if(u.match(/\.(png|jpg|jpeg|gif|webp)/)) return '🖼️';
    if(u.includes('docs.google.com/document') || u.includes('.doc')) return '📝';
    if(u.includes('docs.google.com/spreadsheets') || u.includes('.xls')) return '📊';
    if(u.includes('drive.google.com') || u.includes('dropbox.com')) return '📁';
    if(u.includes('figma.com')) return '🎨';
    if(u.includes('notion.so') || u.includes('notion.site')) return '🗂️';
    return '🔗';
  }

  function hostname(url){
    try{ return new URL(url).hostname.replace('www.',''); }
    catch(e){ return url; }
  }

  function render(){
    const overall = overallCompletion();
    $('progressPct').textContent = overall.pct + '%';
    $('progressFill').style.width = overall.pct + '%';

    const curIdx = currentStageIndex();
    const allDone = overall.pct === 100;
    $('currentChipText').textContent = allDone
      ? '¡Completaste todo el proceso! ✨'
      : 'Etapa actual: ' + STAGES[curIdx].title;

    const tl = $('timeline');
    tl.innerHTML = '';

    STAGES.forEach((stage, idx) => {
      const comp = stageCompletion(stage);
      const isDone = comp.pct === 100;
      const isActive = !isDone && idx === curIdx;
      const isOpen = openStage === stage.id;

      const wrap = document.createElement('div');
      wrap.className = 'stage' + (isDone ? ' done' : '') + (isActive ? ' active' : '') + (isOpen ? ' open' : '');
      wrap.style.setProperty('--stage-color', stage.color);

      wrap.innerHTML = `
        <div class="stage-line">${bridgeSVG(stage.color, idx === STAGES.length-1)}</div>
        <div class="node">${isDone ? checkIcon() : stage.n}</div>
        <div class="card" data-stage="${stage.id}">
          <div class="card-top">
            <div>
              <div class="card-eyebrow">Etapa ${stage.n} de 4</div>
              <div class="card-title">${stage.title}</div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
              <span class="status-pill">${isDone ? 'Completada' : (isActive ? 'En proceso' : 'Por comenzar')}</span>
              <span class="caret">▾</span>
            </div>
          </div>
          <div class="card-desc">${stage.desc}</div>
          <div class="stage-mini-bar"><div class="stage-mini-fill" style="width:${comp.pct}%;"></div></div>
          <div class="checklist">
            <div class="checklist-inner">
              ${stage.items.map((label,i)=>`
                <div class="item ${state[stage.id].checks[i] ? 'checked':''} ${editorMode?'':'readonly'}" data-stage="${stage.id}" data-idx="${i}">
                  <div class="check ${state[stage.id].checks[i] ? 'checked':''} ${editorMode?'':'readonly'}">${checkIcon()}</div>
                  <div class="item-label">${label}</div>
                </div>
              `).join('')}
              <div class="notes-block">
                <div class="notes-label">✎ Notas de tu coach</div>
                ${editorMode ? `
                  <textarea class="notes-edit" data-stage="${stage.id}" placeholder="Dejale una anotación a tu cliente sobre esta etapa...">${state[stage.id].note}</textarea>
                  <div class="notes-save-state" data-savefor="${stage.id}"></div>
                ` : `
                  <div class="notes-view ${state[stage.id].note ? '' : 'empty'}">${state[stage.id].note ? escapeHTML(state[stage.id].note) : 'Tu coach todavía no dejó notas para esta etapa.'}</div>
                `}
              </div>
              <div class="res-block">
                <div class="res-label">📎 Archivos y recursos</div>
                ${state[stage.id].resources.length ? `
                  <div class="res-list">
                    ${state[stage.id].resources.map((r,ri)=>`
                      <a class="res-card" href="${escapeHTML(r.url)}" target="_blank" rel="noopener noreferrer" data-stage="${stage.id}">
                        <div class="res-icon">${resIcon(r.url)}</div>
                        <div class="res-meta">
                          <span class="res-name">${escapeHTML(r.label || hostname(r.url))}</span>
                          <span class="res-url">${escapeHTML(hostname(r.url))}</span>
                        </div>
                        ${editorMode ? `<button class="res-remove" data-stage="${stage.id}" data-ridx="${ri}" title="Quitar">✕</button>` : ''}
                      </a>
                    `).join('')}
                  </div>
                ` : `<div class="res-empty">${editorMode ? 'Todavía no agregaste archivos para esta etapa.' : 'Tu coach todavía no compartió archivos para esta etapa.'}</div>`}
                ${editorMode ? `
                  <div class="res-add">
                    <input type="text" class="res-label-input" data-stage="${stage.id}" placeholder="Título del archivo (ej: Guía de tono de voz)" />
                    <input type="url" class="res-url-input" data-stage="${stage.id}" placeholder="Pegá el link (Drive, Notion, PDF, etc.)" />
                    <button class="res-add-btn" data-stage="${stage.id}">+ Agregar recurso</button>
                    <span class="res-add-hint">Subí el archivo a Drive/Notion primero y pegá acá el link para compartir.</span>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>
        </div>
      `;
      tl.appendChild(wrap);
    });

    // bind card open/close
    tl.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click', (e)=>{
        if(e.target.closest('.item') || e.target.closest('.notes-edit') || e.target.closest('.res-block')) return;
        const sid = card.getAttribute('data-stage');
        openStage = openStage === sid ? null : sid;
        render();
      });
    });

    // bind checkbox toggles (editor mode only)
    if(editorMode){
      tl.querySelectorAll('.item').forEach(item=>{
        item.addEventListener('click', async (e)=>{
          e.stopPropagation();
          const sid = item.getAttribute('data-stage');
          const idx = item.getAttribute('data-idx');
          state[sid].checks[idx] = !state[sid].checks[idx];
          openStage = sid;
          render();
          await saveState();
        });
      });

      tl.querySelectorAll('.notes-edit').forEach(area=>{
        area.addEventListener('click', (e)=> e.stopPropagation());
        area.addEventListener('input', (e)=>{
          const sid = area.getAttribute('data-stage');
          state[sid].note = area.value;
          const status = tl.querySelector(`.notes-save-state[data-savefor="${sid}"]`);
          if(status) status.textContent = 'Escribiendo...';
          clearTimeout(saveTimer);
          saveTimer = setTimeout(async ()=>{
            await saveState();
            if(status) status.textContent = 'Guardado ✓';
          }, 700);
        });
      });

      tl.querySelectorAll('.res-url-input, .res-label-input').forEach(inp=>{
        inp.addEventListener('click', (e)=> e.stopPropagation());
        inp.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter'){
            e.preventDefault();
            const sid = inp.getAttribute('data-stage');
            tl.querySelector(`.res-add-btn[data-stage="${sid}"]`).click();
          }
        });
      });

      tl.querySelectorAll('.res-add-btn').forEach(btn=>{
        btn.addEventListener('click', async (e)=>{
          e.stopPropagation();
          const sid = btn.getAttribute('data-stage');
          const labelInput = tl.querySelector(`.res-label-input[data-stage="${sid}"]`);
          const urlInput = tl.querySelector(`.res-url-input[data-stage="${sid}"]`);
          let url = urlInput.value.trim();
          const label = labelInput.value.trim();
          if(!url) return;
          if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
          state[sid].resources.push({label, url});
          openStage = sid;
          render();
          await saveState();
        });
      });

      tl.querySelectorAll('.res-remove').forEach(btn=>{
        btn.addEventListener('click', async (e)=>{
          e.preventDefault();
          e.stopPropagation();
          const sid = btn.getAttribute('data-stage');
          const ridx = parseInt(btn.getAttribute('data-ridx'), 10);
          state[sid].resources.splice(ridx, 1);
          openStage = sid;
          render();
          await saveState();
        });
      });
    }
  }

  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  $('panelBtn').addEventListener('click', openPanel);

  $('studioBtn').addEventListener('click', ()=>{
    if(editorMode){
      editorMode = false;
      $('studioBtn').textContent = '🔒 Modo estudio';
      $('studioBtn').classList.remove('active');
      $('panelBtn').style.display = 'none';
      $('backToPanelWrap').style.display = 'none';
      render();
      return;
    }
    $('pinBox').classList.toggle('open');
    $('pinInput').focus();
  });
  $('pinSubmit').addEventListener('click', submitPin);
  $('pinInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitPin(); });
  function submitPin(){
    if($('pinInput').value === STUDIO_PIN){
      editorMode = true;
      $('pinBox').classList.remove('open');
      $('pinError').classList.remove('show');
      $('pinInput').value = '';
      $('studioBtn').textContent = '✎ Modo estudio activo';
      $('studioBtn').classList.add('active');
      $('panelBtn').style.display = 'inline-block';
      if(clientSlug) $('backToPanelWrap').style.display = 'block';
      render();
    }else{
      $('pinError').classList.add('show');
    }
  }

  async function attemptClientLogin(name){
    if(!DB_CONNECTED){
      $('loadingNote').textContent = 'El portal todavía no está conectado a la base de datos.';
      return;
    }
    const slug = slugify(name);
    if(!slug) return;
    $('loginError').classList.remove('show');
    $('setClientBtn').disabled = true;
    $('loadingNote').textContent = 'Verificando...';
    try{
      const { data, error } = await sb.from('progress').select('slug').eq('slug', slug).maybeSingle();
      if(error) throw error;
      $('loadingNote').textContent = '';
      if(!data){
        $('loginError').textContent = 'No encontramos ese usuario. Verificá que esté bien escrito o consultá con tu estudio.';
        $('loginError').classList.add('show');
        $('setClientBtn').disabled = false;
        return;
      }
      await loadClientBySlug(slug, name);
    }catch(e){
      $('loadingNote').textContent = '';
      $('loginError').textContent = 'Hubo un problema al verificar tu usuario. Probá de nuevo.';
      $('loginError').classList.add('show');
    }
    $('setClientBtn').disabled = false;
  }

  $('setClientBtn').addEventListener('click', ()=>{
    const val = $('clientInput').value.trim();
    if(val) attemptClientLogin(val);
  });
  $('clientInput').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      const val = $('clientInput').value.trim();
      if(val) attemptClientLogin(val);
    }
  });

  // ---------- STUDIO PANEL ----------
  function openPanel(){
    $('panelOverlay').classList.add('open');
    loadPanelList();
  }
  function closePanel(){
    $('panelOverlay').classList.remove('open');
  }
  $('panelCloseBtn').addEventListener('click', closePanel);
  $('panelOverlay').addEventListener('click', (e)=>{
    if(e.target === $('panelOverlay')) closePanel();
  });

  async function loadPanelList(){
    const body = $('panelBody');
    if(!DB_CONNECTED){
      body.innerHTML = '<div class="panel-empty">El portal todavía no está conectado a la base de datos.</div>';
      return;
    }
    body.innerHTML = '<div class="panel-loading">Cargando clientes...</div>';
    let entries = [];
    try{
      const { data, error } = await sb.from('progress').select('slug, data, updated_at').order('updated_at', {ascending:false});
      if(error) throw error;
      entries = (data || []).map(row => ({slug: row.slug, data: row.data}));
    }catch(e){
      entries = [];
    }

    if(entries.length === 0){
      body.innerHTML = '<div class="panel-empty">Todavía no tenés clientes cargados. Agregá el primero abajo 👇</div>';
      return;
    }

    entries.sort((a,b)=>{
      const ua = (a.data._meta && a.data._meta.updatedAt) || 0;
      const ub = (b.data._meta && b.data._meta.updatedAt) || 0;
      return ub - ua;
    });

    body.innerHTML = '';
    entries.forEach(({slug, data})=>{
      let done=0, total=0;
      STAGES.forEach(s=>{
        const checks = (data[s.id] && data[s.id].checks) || {};
        s.items.forEach((_, i)=>{ total++; if(checks[i]) done++; });
      });
      const pct = total ? Math.round(done/total*100) : 0;
      let curLabel = '¡Completo! ✨';
      if(pct < 100){
        for(const s of STAGES){
          const checks = (data[s.id] && data[s.id].checks) || {};
          const sDone = s.items.every((_, i)=>checks[i]);
          if(!sDone){ curLabel = s.title; break; }
        }
      }
      const name = (data._meta && data._meta.name) || slug;
      const initials = name.trim().slice(0,2).toUpperCase();

      const row = document.createElement('div');
      row.className = 'panel-row';
      row.innerHTML = `
        <div class="panel-avatar">${initials}</div>
        <div class="panel-info">
          <div class="panel-name">${escapeHTML(name)}</div>
          <div class="panel-stage">Etapa: ${escapeHTML(curLabel)}</div>
        </div>
        <div class="panel-pct">${pct}%</div>
        ${editorMode ? `
          <div class="panel-actions">
            <button class="panel-action-btn" data-action="edit" data-slug="${slug}" data-name="${escapeHTML(name)}" title="Editar">✎</button>
            <button class="panel-action-btn danger" data-action="delete" data-slug="${slug}" data-name="${escapeHTML(name)}" title="Borrar">🗑️</button>
          </div>
        ` : ''}
      `;
      row.addEventListener('click', (e)=>{
        if(e.target.closest('.panel-action-btn')) return;
        closePanel();
        loadClientBySlug(slug, name);
      });
      body.appendChild(row);
    });

    if(editorMode){
      body.querySelectorAll('.panel-action-btn[data-action="edit"]').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          editClient(btn.getAttribute('data-slug'), btn.getAttribute('data-name'));
        });
      });
      body.querySelectorAll('.panel-action-btn[data-action="delete"]').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          deleteClientRow(btn.getAttribute('data-slug'), btn.getAttribute('data-name'));
        });
      });
    }
  }

  async function editClient(slug, currentName){
    const newName = window.prompt('Nuevo nombre y apellido para este cliente:', currentName);
    if(newName === null) return;
    const trimmed = newName.trim();
    if(!trimmed) return;
    const newSlug = slugify(trimmed);
    if(!newSlug) return;

    try{
      const { data: rowData, error: fetchErr } = await sb.from('progress').select('data').eq('slug', slug).maybeSingle();
      if(fetchErr) throw fetchErr;
      if(!rowData) return;
      const clientData = rowData.data;
      if(!clientData._meta) clientData._meta = {};
      clientData._meta.name = trimmed;
      clientData._meta.updatedAt = Date.now();

      if(newSlug === slug){
        // name text changed but login slug is the same — just update in place
        const { error } = await sb.from('progress').upsert({slug, data: clientData, updated_at: new Date().toISOString()});
        if(error) throw error;
      }else{
        // slug changes → check it doesn't collide with another existing client
        const { data: collision, error: collErr } = await sb.from('progress').select('slug').eq('slug', newSlug).maybeSingle();
        if(collErr) throw collErr;
        if(collision){
          alert('Ya existe otro cliente con ese nombre. Elegí un nombre distinto.');
          return;
        }
        const { error: insErr } = await sb.from('progress').insert({slug: newSlug, data: clientData, updated_at: new Date().toISOString()});
        if(insErr) throw insErr;
        const { error: delErr } = await sb.from('progress').delete().eq('slug', slug);
        if(delErr) throw delErr;
        if(clientSlug === slug){
          clientSlug = newSlug;
          updateHash(newSlug);
        }
      }
      loadPanelList();
    }catch(e){
      alert('No se pudo editar el cliente. Probá de nuevo.');
    }
  }

  async function deleteClientRow(slug, name){
    const confirmed = window.confirm(`¿Seguro que querés borrar a "${name}"? Se va a perder todo su progreso, notas y archivos. Esta acción no se puede deshacer.`);
    if(!confirmed) return;
    try{
      const { error } = await sb.from('progress').delete().eq('slug', slug);
      if(error) throw error;
      if(clientSlug === slug){
        clientSlug = null;
        clearHash();
        $('setupRow').style.display = 'flex';
        $('progressWrap').style.display = 'none';
        $('timeline').style.display = 'none';
        $('backToPanelWrap').style.display = 'none';
        $('greetingName').textContent = 'Hola 👋';
      }
      loadPanelList();
    }catch(e){
      alert('No se pudo borrar el cliente. Probá de nuevo.');
    }
  }

  function clearHash(){
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){ /* ignore */ }
  }

  $('panelAddBtn').addEventListener('click', ()=>{
    const val = $('panelNewClient').value.trim();
    if(!val) return;
    $('panelNewClient').value = '';
    closePanel();
    loadClient(val);
  });
  $('panelNewClient').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') $('panelAddBtn').click();
  });
  $('backToPanelLink').addEventListener('click', (e)=>{
    e.preventDefault();
    openPanel();
  });

  // ---------- INIT: restore client from URL hash, or fall back to last-viewed ----------
  (function init(){
    if(!DB_CONNECTED){
      $('loadingNote').textContent = '⚠️ Falta conectar la base de datos (Supabase) en el código del portal.';
    }
    // A propósito: cada vez que se entra o se refresca la página, arranca en la
    // pantalla de login. No se restaura ninguna sesión anterior por URL ni por
    // dispositivo — cada visita empieza sin usuario cargado.
    clearHash();
  })();
})();
</script>
</body>
</html>
